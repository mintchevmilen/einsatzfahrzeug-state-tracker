name: Sicherung
# Gehoert in ein PRIVATES Repository, nicht in das oeffentliche App Repository.
# Secrets dort anlegen: BACKUP_EMAIL und BACKUP_PASSWORD (Admin der App).
# Die Sicherung wird als Artefakt dieses privaten Repositories gespeichert.
on:
  schedule:
    - cron: '43 3 * * 1'   # montags
  workflow_dispatch:
jobs:
  sicherung:
    runs-on: ubuntu-latest
    steps:
      - name: App Repository holen (oeffentlich, nur die Skripte)
        uses: actions/checkout@v4
        with:
          repository: mintchevmilen/einsatzfahrzeug-state-tracker
          path: app
      - name: Keep Alive
        run: python3 app/tools/keepalive.py
      - name: Sicherung
        env:
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: python3 app/tools/backup.py sicherung
      - uses: actions/upload-artifact@v4
        with:
          name: sicherung-${{ github.run_number }}
          path: sicherung
          retention-days: 90
